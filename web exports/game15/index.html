<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>fps</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: black;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

/* Animated CSS Art Loading Screen */
.wall{
    display: flex;
}

.canvas{
    width: 100vw;
    height: 100vh;
    background-image: linear-gradient(rgb(190, 248, 0) , rgb(0, 255, 157) 75%, rgb(255, 0, 106));
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    flex-wrap: wrap;
    padding-top: 10%;
    z-index: 0;
    overflow: hidden;
}

.line_vert{
    position: absolute;
    background-color: bisque;
    height: 500px;
    width: 5px;
    z-index: 3;
    margin-left: 30%;
}

.square{
    background-color: black;
    width: 50%;
    height: 200px;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    z-index: 1;
    overflow: visible;
}

.square:nth-of-type(2){
    background-color: rgb(244, 102, 102);
}

.square:nth-of-type(3){
    background-color: yellow;
}

.square:nth-of-type(4){
    background-color: blue;
}

.line{
    position: relative;
    top: 20px;
    width: 100%;
    height: 5px;
    background-color: white;
}

.circle{
    display: flex;
    margin: 0 auto;
    position: relative;
    top: 10%;
    border-radius: 50%;
    background-color: rgb(157, 0, 255);
    width: 160px;
    height: 160px;
    z-index: 2;
}

.square:nth-of-type(2) > .circle{
    background-color: pink;
}

.square:nth-of-type(3) > .circle{
    background-color: darkgoldenrod;
}

.square:nth-of-type(4) > .circle{
    background-color: lightcyan;
}

.triangle{
    position: relative;
    width: 0px;
    height: 0px;
    border-left: 80px solid transparent;
    border-right: 150px solid transparent;
    border-bottom: 40px solid #00fff2;
    top: 30px;
    z-index: 3;
    animation-name: triangle;
    animation-duration: 13s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.rectangle_container{
    position: absolute;
    margin: 0px 10%;
    width: 80%;
    height: 40px;
    bottom: 10px;
    z-index: 3;
    opacity: 50%;
    animation-name: rectangle;
    animation-duration: 12s;
    animation-direction: alternate;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.rectangle_container.top{
    position: absolute;
    border: 2px solid lightseagreen;
    opacity: 100%;
    margin: 0px 10%;
    width: 80%;
    height: 40px;
    top: 10px;
    z-index: 3;
    animation-name: rectangle;
    animation-duration: 12s;
    animation-direction: alternate;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.logo_container{
    display: flex;
}

.logo{
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: rgb(26, 5, 5);
    border: 1px solid red;
    width: 30px;
    height: 30px;
    animation-name: logo;
    animation-duration: 5s;
    animation-direction: alternate;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.logo:nth-of-type(1){
    position: absolute;
    top: 10px;
    right: 50px;
    background-color: rgb(233, 232, 232);
    border: 1px solid;
    width: 30px;
    height: 30px;
    animation-name: logo;
    animation-duration: 3s;
    animation-direction: reverse;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.logo:nth-of-type(2){
    position: absolute;
    top: 10px;
    right: 90px;
    background-color: rgb(83, 33, 33);
    border: 1px solid white;
    width: 30px;
    height: 30px;
    animation-name: logo;
    animation-duration: 3s;
    animation-direction: alternate;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.loading-text {
	font-family: Arial, sans-serif;
	font-size: 12px;
	color: white;
	position: absolute;
	bottom: 50px;
	left: 50%;
	transform: translateX(-50%);
	z-index: 10;
}

@keyframes rectangle{
    from {
        background-color: yellow;
        width: 300px;
        bottom: 10px;
        border: 1px solid red;
    }
    to {
        background-color: pink;
        width: 50px;
        bottom: 100px;
        border: 15px solid black;
    }
}

@keyframes triangle{
    0%{
        transform: rotate(0deg);
        size: 300px;
        border-left: 80px solid transparent;
        border-right: 150px solid transparent;
        border-bottom: 40px solid #00fff2;
    }
    50%{
        border-left: 20px solid transparent;
        border-right: 170px solid transparent;
        border-bottom: 220px solid #7288d8;
    }
    100%{
        transform: rotate(360deg);
        size: 100px;
        border-left: 80px solid transparent;
        border-right: 150px solid transparent;
        border-bottom: 40px solid #00fff2;
    }
}

@keyframes logo{
    0%{
        border-radius: 0px;
    }
    50%{
        border-radius: 100%;
    }
    100%{
        border-radius: 0%;
    }
}

#status-splash {
	display: none !important;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div class="wall">
				<div class="canvas">
					<div class="line_vert"></div>
					
					<div class="square">
						<span class="line"></span>
						<span class="line"></span>
						<span class="line"></span>
						<div class="circle">
							<div class="triangle"></div>
						</div>
					</div>
					
					<div class="square">
						<div class="line_vert"></div>
						<div class="circle">
							<div class="triangle"></div>
						</div>
					</div>
					
					<div class="square">
						<div class="circle">
							<div class="line_vert"></div>
							<div class="triangle"></div>
						</div>
					</div>
				   
					<div class="square">
						<span class="line"></span>
						<span class="line"></span>
						<span class="line"></span>
						<div class="circle">
							<div class="triangle"></div>
						</div>
					</div>
					
					<div class="rectangle_container"></div>
					<div class="rectangle_container top"></div>

					<div class="logo_container">
						<div class="logo"></div>
						<div class="logo"></div>
						<div class="logo"></div>
					</div>
				</div>
			</div>
			<div class="loading-text">loading</div>
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":19297040,"index.wasm":36145869},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
